# Winala: publish predictions before matches and settle the public record after them.
# Runs twice a day. Needs ONE repository secret: WINALA_INGEST_SECRET
# (Settings → Secrets and variables → Actions). URL and key below are public.
name: Winala daily model

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC = 04:17/05:17 Haiti
    - cron: "17 21 * * *"  # 21:17 UTC
  workflow_dispatch: {}

concurrency:
  group: winala-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: model
    env:
      SUPABASE_URL: https://mbufjulnnzggxosvhtvf.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_NDKEQPiuAw4FgNgbNrvLEQ_PGwRVdom
      INGEST_SECRET: ${{ secrets.WINALA_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: pip install -r requirements.txt
      - name: Settle finished matches (and refund unplayed ones)
        run: python settle.py
      - name: Publish predictions for upcoming matches
        run: python predict.py
